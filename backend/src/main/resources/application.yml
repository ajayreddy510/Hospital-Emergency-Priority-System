server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: hospital-emergency-priority-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/hospital_emergency_db}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_signing_key_for_hospital_emergency_priority_system_2026_min_256_bits_length}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:*,https://*.vercel.app,https://*.onrender.com,http://localhost:5173,http://localhost:3000}
  dev-seed:
    enabled: ${DEV_SEED_ENABLED:true}

logging:
  level:
    root: INFO
    com.hospital.priority: DEBUG
